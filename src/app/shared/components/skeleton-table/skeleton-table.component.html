<table
  class="w-full table-fixed text-sm text-left text-gray-500 dark:text-gray-400"
>
  <thead
    class="text-xs text-gray-700 uppercase bg-gray-50 dark:bg-gray-700 dark:text-gray-400"
  >
    <tr>
      <th scope="col" class="px-4 py-3">Name</th>
      <th scope="col" class="px-4 py-3">Email</th>
      <th scope="col" class="px-4 py-3">Phone</th>
      <th scope="col" class="px-4 py-3">Creation Date</th>
    </tr>
  </thead>
  <tbody>
    @for (i of [1, 2, 3, 4, 5]; track i) {
      <tr class="border-b dark:border-gray-700 animate-pulse">
        <td class="px-4 py-3">
          <div class="h-4 bg-gray-200 dark:bg-gray-700 rounded w-32"></div>
        </td>
        <td class="px-4 py-3">
          <div class="h-4 bg-gray-200 dark:bg-gray-700 rounded w-48"></div>
        </td>
        <td class="px-4 py-3">
          <div class="h-4 bg-gray-200 dark:bg-gray-700 rounded w-24"></div>
        </td>
        <td class="px-4 py-3">
          <div class="h-4 bg-gray-200 dark:bg-gray-700 rounded w-28"></div>
        </td>
      </tr>
    }
  </tbody>
</table>
