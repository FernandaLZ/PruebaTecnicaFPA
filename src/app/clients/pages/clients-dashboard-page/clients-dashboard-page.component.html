<section class="bg-gray-50 dark:bg-gray-900 p-3 sm:p-5">
  <div class="mx-auto max-w-screen-xl px-4 lg:px-12">
    <div
      class="bg-white dark:bg-gray-800 relative shadow-md sm:rounded-lg overflow-hidden"
    >
      <div
        class="flex flex-col md:flex-row items-center justify-between space-y-3 md:space-y-0 md:space-x-4 p-4"
      >
        <!-- Input -->
        <div class="w-full md:w-1/2">
          <form class="flex items-center">
            <label for="simple-search" class="sr-only">Search</label>
            <div class="relative w-full">
              <div
                class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none"
              >
                <fa-icon [icon]="faMagnifyingGlass"></fa-icon>
              </div>
              <input
                type="text"
                id="simple-search"
                class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full pl-10 p-2 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500"
                placeholder="Search Name"
                (input)="searchControl.set($any($event.target).value)"
              />
            </div>
          </form>
        </div>
        <!-- New client button -->
        <div
          class="w-full md:w-auto flex flex-col md:flex-row space-y-2 md:space-y-0 items-stretch md:items-center justify-end md:space-x-3 flex-shrink-0"
        >
          <button
            type="button"
            (click)="addClient()"
            class="bg-gray-50 hover:bg-gray-300 shadow-xs font-medium rounded-base text-sm px-4 py-2 focus:outline-none dark:bg-gray-700 dark:text-white dark:border-gray-600 dark:hover:bg-gray-600 dark:hover:text-white"
          >
            New Client
          </button>
        </div>
      </div>
      <div class="overflow-x-auto">
        @if (clientResource.isLoading()) {
          <table-skeleton-table></table-skeleton-table>
        }
        @if (clientResource.value(); as clients) {
          <client-table [filteredClients]="filteredClients()"></client-table>
        }
      </div>
      <div class="flex justify-end">
        <client-pagination
          [pages]="pages()"
          [currentPage]="currentPage()"
        ></client-pagination>
      </div>
    </div>
  </div>
</section>
