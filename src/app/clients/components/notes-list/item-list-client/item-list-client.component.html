<li class="py-2 sm:py-2">
  <div class="flex flex-row items-center gap-4">
    <div class="flex-1">
      <p class="font-medium break-words">
        {{ note().title }}
      </p>
      <!-- <p class="text-sm text-body break-words">
                  {{ note.body }}
                </p> -->
    </div>
    <div class="items-center">
      <button
        (click)="deleteNote(note().id)"
        matTooltip="Remove"
        type="button"
        class="flex items-center justify-center h-9 w-9 hover:ring-1 hover:ring-primary-200 text-gray-500 hover:bg-gray-100 hover:rounded hover:text-gray-700 dark:bg-gray-800 dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-white"
      >
        <fa-icon [icon]="faTrash"></fa-icon>
      </button>
    </div>
  </div>
</li>
